<!DOCTYPE html>
<html>
<head>
    <title>Live Bet</title>
    <style>
        body { 
            font-family: 'Arial', sans-serif; 
            text-align: center; 
            background: #f0f2f5; 
            padding: 20px;
        }
        .match {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin: 20px auto;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        #matchTitle {
            color: #2c3e50;
            font-size: 22px;
            margin-bottom: 10px;
        }
        #matchTime {
            font-size: 18px;
            color: #e74c3c;
            font-weight: bold;
            margin: 10px 0;
        }
        #score {
            font-size: 36px;
            font-weight: bold;
            margin: 15px 0;
            color: #2c3e50;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
        }
        .stat {
            font-size: 16px;
            color: #34495e;
        }
        .stat span {
            font-weight: bold;
            color: #3498db;
        }
        .last-update {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 15px;
        }
        .debug {
            font-family: monospace;
            background: #f0f0f0;
            padding: 10px;
            margin-top: 20px;
            border-radius: 5px;
            text-align: left;
            max-width: 500px;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <h1 style="color: #2c3e50;">⚽ Live Bet Tracker</h1>
    <div class="match">
        <h2 id="matchTitle">Cargando partido...</h2>
        <div id="matchTime">--:--</div>
        <div id="score">0 - 0</div>
        <div class="stats">
            <div class="stat">Corners: <span id="corners">0</span></div>
            <div class="stat">Amarillas: <span id="amarillas">0</span></div>
        </div>
        <div class="last-update" id="lastUpdate">Última actualización: --</div>
    </div>

    <!-- Área de depuración para ver los datos crudos -->
    <div class="debug">
        <h3>Datos recibidos de Google Sheets:</h3>
        <pre id="debugData">Cargando...</pre>
    </div>

    <script>
        // Configuración
        const SHEET_ID = "1C4NaNDCS0h_T34Ee6mHz4dCTTf_m3FuHId8-LypD_HY";
        const SHEET_NAME = "Hoja1";
        const API_URL = `https://opensheet.elk.sh/${SHEET_ID}/${SHEET_NAME}`;

        function updateData() {
            fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    // Mostrar datos crudos para depuración
                    document.getElementById('debugData').textContent = 
                        JSON.stringify(data, null, 2);
                    
                    if (data && data.length > 0) {
                        const partido = data[0];
                        
                        // Mapeo de columnas (ignorando mayúsculas/minúsculas)
                        const getValue = (obj, key) => {
                            const lowerKey = key.toLowerCase();
                            const foundKey = Object.keys(obj).find(k => k.toLowerCase() === lowerKey);
                            return obj[foundKey] || 0;
                        };

                        // Actualizar interfaz
                        document.getElementById('matchTitle').textContent = 
                            `${getValue(partido, "Local")} vs ${getValue(partido, "Visitante")}`;
                        document.getElementById('matchTime').textContent = 
                            `${getValue(partido, "Minuto")}'`;
                        document.getElementById('score').textContent = 
                            `${getValue(partido, "GolesLocal")} - ${getValue(partido, "GolesVisitante")}`;
                        document.getElementById('corners').textContent = 
                            getValue(partido, "Corners");
                        document.getElementById('amarillas').textContent = 
                            getValue(partido, "Amarillas");
                        
                        // Última actualización
                        document.getElementById('lastUpdate').textContent = 
                            `Última actualización: ${new Date().toLocaleTimeString()}`;
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    document.getElementById('debugData').textContent = 
                        `Error al cargar datos: ${error.message}`;
                });
        }

        // Iniciar
        updateData();
        setInterval(updateData, 5000);
    </script>
</body>
</html>
